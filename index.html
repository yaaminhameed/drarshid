  <script>
    // Inject all component CSS into a stylesheet — components define their own styles
    window.addEventListener('DOMContentLoaded', () => {
      // Wait briefly for Babel scripts to register style strings
      const inject = () => {
        const all = [
          window.navStyles, window.heroStyles, window.statsStyles, window.aboutStyles,
          window.servicesStyles, window.conditionsStyles, window.rhinoStyles,
          window.journeyStyles, window.faqStyles
        ].filter(Boolean).join('\n');
        if (all) {
          const style = document.createElement('style');
          style.id = 'component-styles';
          style.textContent = all;
          document.head.appendChild(style);
        } else {
          setTimeout(inject, 80);
        }
      };
      setTimeout(inject, 200);
    });
  </script>
